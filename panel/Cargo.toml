[workspace]
members = [
    "crates/panel-core",
    "crates/panel-agent",
    "crates/panel-api",
    "crates/panel-cli",
]
resolver = "2"

[workspace.dependencies]
axum = { version = "0.7", features = ["macros"] }
axum-extra = { version = "0.9", features = ["typed-header", "cookie"] }
tokio = { version = "1", features = ["full"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "1"
anyhow = "1"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "json"] }
sqlx = { version = "0.7", features = ["postgres", "runtime-tokio", "macros", "migrate", "uuid", "chrono", "json"] }
argon2 = "0.5"
rand = "0.8"
rand_core = { version = "0.6", features = ["std"] }
base64 = "0.21"
chrono = { version = "0.4", features = ["serde"] }
uuid = { version = "1", features = ["v4", "serde"] }
tower = "0.4"
tower-http = { version = "0.5", features = ["cors", "trace"] }
http = "1"
mime = "0.3"
async-trait = "0.1"
clap = { version = "4", features = ["derive"] }
config = "0.13"
dotenvy = "0.15"
reqwest = { version = "0.11", default-features = false, features = ["json", "rustls-tls"] }
sha2 = "0.10"
hmac = "0.12"
hex = "0.3"
lettre = { version = "0.11", default-features = false, features = ["builder", "hostname", "smtp-transport", "tokio1", "tokio1-rustls", "rustls", "ring", "webpki-roots"] }
rustls = "0.21"
tokio-rustls = "0.24"
webpki-roots = "0.22"
schemars = { version = "0.8", features = ["derive", "uuid1", "chrono"] }
regex = "1"
once_cell = "1"
aes-gcm = "0.10"
ring = "0.17"
totp-rs = { version = "5", features = ["gen_secret", "otpauth"] }
tower-cookies = "0.10"
futures = "0.3"
bytes = "1"
time = "0.3"