[package]
name = "panel-agent"
version = "0.1.0"
edition = "2021"

[[bin]]
name = "panel-agent"
path = "src/main.rs"

[dependencies]
panel-core = { path = "../panel-core" }
tokio = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
thiserror = { workspace = true }
anyhow = { workspace = true }
tracing = { workspace = true }
tracing-subscriber = { workspace = true }
async-trait = { workspace = true }
uuid = { workspace = true }
chrono = { workspace = true }
clap = { workspace = true }
regex = { workspace = true }
once_cell = { workspace = true }
toml = "0.8"
serde_yaml = { version = "0.9", optional = true }
base64 = { workspace = true, optional = true }
sha-crypt = { version = "0.5", optional = true }
reqwest = { workspace = true }
sha2 = { workspace = true }
hmac = { workspace = true }
async-compression = { version = "0.4", features = ["tokio", "gzip"] }

[features]
default = []
docker = ["dep:serde_yaml", "dep:base64"]
# Nixpacks, Railpack, and Cloud Native Buildpacks for applications without a
# Dockerfile. The binaries themselves are installed (pinned) by the installer.
builders = ["docker"]
mail = ["dep:sha-crypt"]
antivirus = []
