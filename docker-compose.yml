services:
  postgres:
    image: postgres:16-alpine
    container_name: scontrol-test-pg
    restart: unless-stopped
    environment:
      POSTGRES_USER: scontrol
      POSTGRES_PASSWORD: scontrol
      POSTGRES_DB: scontrol
    ports:
      - "127.0.0.1:55432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

volumes:
  postgres_data:
