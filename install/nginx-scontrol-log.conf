# Managed by scontrol installer. Included in Nginx's http context
# (/etc/nginx/conf.d/), so every server block inherits the access log
# below unless it sets its own `access_log`.
#
# Request statistics are read from this file by panel-agent. The format
# holds no request or response headers (no Authorization or Cookie), no
# query string ($uri, not $request_uri), no user agent and no referer.
# `escape=json` keeps a hostile Host header or URI from breaking the JSON.
log_format scontrol_json escape=json '{"time":"$time_iso8601","remote_addr":"$remote_addr","host":"$host","status":$status,"request_time":$request_time,"bytes_sent":$bytes_sent,"uri":"$uri"}';

access_log /var/log/nginx/scontrol-access.json.log scontrol_json buffer=32k flush=5s;
